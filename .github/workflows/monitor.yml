name: monitor

on:
  # The schedule is off in this demo repo so it doesn't commit a new price history every
  # 6 hours. Uncomment these two lines to turn it on (the time is in UTC).
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# two runs pushing the database at the same time would conflict
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      # data/ is gitignored so local runs don't get committed by accident, hence -f.
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so this won't start the tests.
      - name: Commit price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/prices.db
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Update price history"
          git pull --rebase
          git push
